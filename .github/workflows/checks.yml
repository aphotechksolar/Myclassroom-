name: MyClassroom checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check JavaScript syntax
        working-directory: backend
        run: npm run check
