<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register • MyClassroom</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="auth-card"><a class="brand" href="/">MyClassroom</a><h1>Create account</h1><form id="register"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><label>Role<select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></label><button class="btn">Create account</button></form><div id="msg"></div><a href="/login.html">I already have an account</a></main><script src="/app.js"></script></body></html>
