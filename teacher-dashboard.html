<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><b>MyClassroom</b><button onclick="logout()">Logout</button></header><div class="layout"><aside><button onclick="show('home')">🏠 Dashboard</button><button onclick="show('students')">👥 Students</button><button onclick="show('materials')">📚 Materials</button><button onclick="show('assignments')">📝 Assignments</button><button onclick="show('quizzes')">❓ Quizzes</button><button onclick="show('exams')">🧪 Exams</button><button onclick="show('grades')">📊 Gradebook</button></aside><main>
<section id="home" class="view"><h1>Teacher Dashboard</h1><div class="stats"><span><b id="studentsN">0</b>Students</span><span><b id="assignN">0</b>Assignments</span><span><b id="quizN">0</b>Quizzes</span><span><b id="examN">0</b>Exams</span></div><div class="box"><p>Use the menu to manage your classroom. Data created here is saved in this browser.</p></div></section>
<section id="students" class="view"><h1>Students</h1><div class="box"><input id="studentSearch" placeholder="Search students" oninput="render()"><div id="studentsList"></div></div></section>
<section id="materials" class="view"><h1>Learning Materials</h1><div class="box"><input id="mt" placeholder="Material title"><input id="ms" placeholder="Subject"><button class="btn" onclick="addMaterial()">Add Material</button><div id="materials"></div></div></section>
<section id="assignments" class="view"><h1>Assignments</h1><div class="box"><input id="at" placeholder="Assignment title"><textarea id="ai" placeholder="Instructions"></textarea><input id="ad" type="date"><button class="btn" onclick="addAssignment()">Create Assignment</button><div id="assignments"></div></div></section>
<section id="quizzes" class="view"><h1>Quizzes</h1><div class="box"><input id="qt" placeholder="Quiz title"><input id="qq" type="number" placeholder="Number of questions"><button class="btn" onclick="addQuiz()">Create Quiz</button><div id="quizzes"></div></div></section>
<section id="exams" class="view"><h1>Examinations</h1><div class="box"><input id="et" placeholder="Exam title"><input id="ed" type="number" value="60" placeholder="Duration in minutes"><button class="btn" onclick="addExam()">Create Exam</button><div id="exams"></div></div></section>
<section id="grades" class="view"><h1>Gradebook</h1><div class="box"><table><tr><th>Student</th><th>Assignment</th><th>Quiz</th><th>Exam</th></tr><tbody id="gradesBody"></tbody></table></div></section>
</main></div><script src="app.js"></script></body></html>
