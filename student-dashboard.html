<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><b>MyClassroom</b><button onclick="logout()">Logout</button></header><div class="layout"><aside><button onclick="show('home')">🏠 Dashboard</button><button onclick="show('courses')">📚 Courses</button><button onclick="show('materials')">📖 Materials</button><button onclick="show('assignments')">📝 Assignments</button><button onclick="show('quizzes')">❓ Quizzes</button><button onclick="show('exams')">🧪 Exams</button><button onclick="show('results')">📊 Results</button></aside><main>
<section id="home" class="view"><h1>Student Dashboard</h1><div class="stats"><span><b>4</b>Courses</span><span><b id="pending">0</b>Assignments</span><span><b>86%</b>Average</span><span><b>92%</b>Attendance</span></div></section>
<section id="courses" class="view"><h1>My Courses</h1><div class="cards"><div>Mathematics</div><div>English Language</div><div>Basic Science</div></div></section>
<section id="materials" class="view"><h1>Learning Materials</h1><div id="studentMaterials"></div></section>
<section id="assignments" class="view"><h1>Assignments</h1><div id="studentAssignments"></div></section>
<section id="quizzes" class="view"><h1>Quizzes</h1><div id="studentQuizzes"></div></section>
<section id="exams" class="view"><h1>Examinations</h1><div id="studentExams"></div></section>
<section id="results" class="view"><h1>My Results</h1><div class="box"><p>Mathematics: 88%</p><p>English: 86%</p><p>Science: 92%</p></div></section>
</main></div><script src="app.js"></script></body></html>
